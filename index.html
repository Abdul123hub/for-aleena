<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abdul Rehman & Aleena</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');
        
        body {
            background: linear-gradient(135deg, #0a0a0a, #1a1428);
            font-family: 'Inter', sans-serif;
            color: #e0d4ff;
            min-height: 100vh;
            padding: 15px;
            margin: 0;
        }
        
        .container {
            max-width: 440px;
            margin: 0 auto;
            background: rgba(15, 15, 25, 0.95);
            border-radius: 24px;
            padding: 25px 20px;
            box-shadow: 0 15px 40px rgba(100, 50, 200, 0.25);
            border: 1px solid rgba(150, 100, 255, 0.2);
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 6px;
            background: linear-gradient(to right, #d8b4fe, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle { text-align: center; color: #a78bfa; font-size: 1.15rem; margin-bottom: 25px; }
        
        .tabs {
            display: flex;
            background: rgba(30, 30, 50, 0.8);
            border-radius: 50px;
            padding: 6px;
            margin: 20px 0;
        }
        
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 500;
        }
        
        .tab.active { background: #8b5cf6; color: white; }
        
        button {
            width: 100%;
            padding: 16px;
            margin: 10px 0;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1.1rem;
        }
        
        .truth-btn { background: linear-gradient(90deg, #7c3aed, #a855f7); color: white; }
        .dare-btn { background: linear-gradient(90deg, #db2777, #f472b6); color: white; }
        .letter-btn { background: linear-gradient(90deg, #c026d3, #db2777); color: white; }
        
        .card {
            background: rgba(30, 25, 50, 0.9);
            border: 2px solid #a78bfa;
            padding: 25px;
            border-radius: 20px;
            margin: 20px 0;
            min-height: 190px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.65;
        }
        
        img { max-width: 100%; border-radius: 16px; margin: 12px 0; border: 2px solid #c4b5fd; }
        
        .footer { text-align: center; margin-top: 35px; opacity: 0.75; font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Abdul Rehman & Aleena</h1>
        <p class="subtitle">Our Private World 💜</p>

        <div class="tabs">
            <div class="tab active" onclick="switchTab(0)">Truth or Dare</div>
            <div class="tab" onclick="switchTab(1)">Love Letter</div>
            <div class="tab" onclick="switchTab(2)">Cute Challenges</div>
        </div>

        <!-- Truth or Dare -->
        <div id="tab0">
            <button onclick="getTruth()" class="truth-btn">Truth 💜</button>
            <button onclick="getDare()" class="dare-btn">Dare ❤️</button>
            <div id="level" style="text-align:center; margin:15px 0; color:#c4b5fd; font-weight:600;"></div>
            <div id="question" class="card">Choose Truth or Dare 💕</div>
            <button onclick="newOne()" style="background:#4c1d95;">Next Question</button>
        </div>

        <!-- Love Letter -->
        <div id="tab1" style="display:none;">
            <textarea id="letterText" rows="5" placeholder="Write something sweet..."></textarea>
            <button onclick="generateLoveLetter()" class="letter-btn">Create Beautiful Card 💌</button>
            <div id="letterCard" class="card" style="display:none;"></div>
            <button onclick="shareWhatsApp()" style="background:#22c55e;">Share on WhatsApp</button>
        </div>

        <!-- Cute Challenges -->
        <div id="tab2" style="display:none;">
            <button onclick="getCuteChallenge()" style="background:linear-gradient(90deg, #7c3aed, #db2777);">Get Cute Challenge</button>
            <div id="cuteCard" class="card">Click for special challenges 💕</div>
        </div>

        <div class="footer">
            Made with love by Abdul Rehman ❤️<br>Only for Aleena
        </div>
    </div>

    <script>
        let isAleena = false;

        const myPic = "abdul-rehman.jpg";
        const aleenaPic = "aleena.jpg";

        // Full Questions Lists
        const girlTruths = [
            "What do you love most about Abdul Rehman? 💜",
            "What is the most romantic thing Abdul has done for you?",
            "Describe your dream date with Abdul Rehman 💕",
            "What naughty thought have you had about Abdul recently? 🔥",
            "Which part of Abdul turns you on the most? 💋",
            "Have you ever had a hot dream about Abdul? 😈",
            "What intimate thing do you want Abdul to do to you?",
            "What is your darkest fantasy with Abdul Rehman? 😘"
        ];

        const girlDares = [
            "Send a flying kiss video 💋",
            "Record a voice note moaning Abdul Rehman's name softly 👄",
            "Send a photo in nightwear 💕",
            "Do a slow seductive dance and send video 🔥",
            "Send a mirror selfie biting your lip 😈",
            "Record a voice note saying how much you want Abdul 💋",
            "Send a cute goodnight voice note with kisses 😘"
        ];

        const boyTruths = [
            "What do you love most about Aleena? 💜",
            "What is the most beautiful thing about Aleena?",
            "Describe your ideal romantic night with Aleena 💕",
            "What naughty thought have you had about Aleena recently? 🔥",
            "Which part of Aleena attracts you the most? 💋",
            "Have you ever had a hot dream about Aleena? 😈",
            "What is your darkest fantasy with Aleena? 😘"
        ];

        const boyDares = [
            "Send a shirtless photo 💪",
            "Record a voice note moaning Aleena's name seductively 👄",
            "Do a slow sexy dance and send video 🔥",
            "Send a mirror selfie in underwear 😈",
            "Record a voice note telling Aleena how much you want her 💋",
            "Send a flying kiss video 😘"
        ];

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function switchTab(n) {
            document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===n));
            document.getElementById('tab0').style.display = n===0 ? 'block' : 'none';
            document.getElementById('tab1').style.display = n===1 ? 'block' : 'none';
            document.getElementById('tab2').style.display = n===2 ? 'block' : 'none';
        }

        function getTruth() {
            document.getElementById('level').innerHTML = "❤️ TRUTH";
            let q = isAleena ? getRandom(girlTruths) : getRandom(boyTruths);
            document.getElementById('question').innerHTML = q + "<br><br><b>📸 Screenshot & Send</b>";
        }

        function getDare() {
            document.getElementById('level').innerHTML = "🔥 DARE";
            let d = isAleena ? getRandom(girlDares) : getRandom(boyDares);
            document.getElementById('question').innerHTML = d + "<br><br><b>📸 Screenshot & Send</b>";
        }

        function newOne() {
            Math.random() > 0.5 ? getTruth() : getDare();
        }

        function generateLoveLetter() {
            const text = document.getElementById("letterText").value.trim() || "I love you so much 💜";
            const card = document.getElementById("letterCard");
            const pic = isAleena ? aleenaPic : myPic;

            card.innerHTML = `
                <img src="${pic}" alt="Our Love">
                <strong style="color:#c4b5fd; font-size:1.4rem;">💌 To My ${isAleena ? 'Abdul Rehman' : 'Aleena'} 💌</strong><br><br>
                ${text}<br><br>
                <em>Forever Yours ❤️</em>
            `;
            card.style.display = "block";
        }

        function shareWhatsApp() {
            const card = document.getElementById("letterCard");
            if (card.style.display === "block") {
                window.open(`https://wa.me/?text=${encodeURIComponent(card.innerText)}`, '_blank');
            }
        }

        function getCuteChallenge() {
            const challenges = [
                "Send 10 💋 kisses in a voice note",
                "Write 'Abdul Rehman ❤️ Aleena' on your hand and send photo",
                "Record a video saying I love you with flying kisses 😘"
            ];
            document.getElementById('cuteCard').innerHTML = getRandom(challenges) + "<br><br><b>Send to your love 💕</b>";
        }

        window.onload = () => {
            const name = prompt("Enter your name (Aleena or Abdul Rehman):");
            if (name) isAleena = name.toLowerCase().includes("aleena");
        };
    </script>
</body>
</html>
