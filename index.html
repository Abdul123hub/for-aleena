```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aleena ❤️ Abdul</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff4d88,#ff3366);
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.container{
    max-width:500px;
    padding:25px;
    background:rgba(255,255,255,0.15);
    border-radius:20px;
}

input{
    width:80%;
    padding:12px;
    border:none;
    border-radius:25px;
    margin:10px 0;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:25px;
    cursor:pointer;
    font-weight:bold;
    margin:5px;
}

.card{
    margin-top:20px;
    padding:20px;
    background:rgba(255,255,255,0.15);
    border-radius:15px;
    min-height:100px;
}
</style>
</head>
<body>

<div class="container">

<h1>❤️ Aleena & Abdul ❤️</h1>

<div id="login">
    <input type="text" id="name" placeholder="Enter Name">
    <br>
    <button onclick="startGame()">Enter ❤️</button>
</div>

<div id="game" style="display:none;">
    <button onclick="truth()">Truth 😇</button>
    <button onclick="dare()">Dare 😈</button>

    <div class="card" id="question">
        Welcome ❤️
    </div>
</div>

</div>

<script>

const truths = [
"What is your favorite memory together?",
"What do you admire most about your partner?",
"When did you first realize you liked them?",
"What is your dream date?",
"What makes your partner special?"
];

const dares = [
"Send 10 heart emojis ❤️",
"Send a cute selfie 📸",
"Tell your partner one thing you appreciate about them.",
"Send a romantic song 🎵",
"Give your partner a cute nickname."
];

function randomItem(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}

function startGame(){

    const name =
    document.getElementById("name")
    .value
    .trim()
    .toLowerCase();

    const allowed = [
        "aleena",
        "abdul",
        "abdul rehman",
        "abdulrehman"
    ];

    if(!allowed.includes(name)){
        alert("Access Denied ❤️");
        return;
    }

    document.getElementById("login").style.display="none";
    document.getElementById("game").style.display="block";
}

function truth(){
    document.getElementById("question").innerText =
    randomItem(truths);
}

function dare(){
    document.getElementById("question").innerText =
    randomItem(dares);
}

</script>

</body>
</html>
