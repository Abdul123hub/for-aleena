<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleena Loves Abdul - Truth or Dare</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap');
       
        body {
            background: linear-gradient(135deg, #ff0066, #ff3366, #cc0066);
            font-family: 'Poppins', sans-serif;
            color: white;
            text-align: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { 
            max-width: 440px; 
            margin: 0 auto; 
            background: rgba(0,0,0,0.15);
            border-radius: 28px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { 
            font-family: 'Playfair Display', serif; 
            font-size: 2.6rem; 
            margin: 15px 0 8px; 
            text-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }
        h2 { 
            font-size: 1.4rem; 
            margin: 0 0 25px; 
            opacity: 0.95;
        }
        input {
            padding: 16px 20px;
            font-size: 1.15rem;
            width: 85%;
            border-radius: 50px;
            border: none;
            margin: 15px 0 20px;
            text-align: center;
            background: white;
            color: #333;
        }
        button {
            padding: 16px 35px;
            font-size: 1.2rem;
            margin: 10px 6px;
            border: none;
            border-radius: 50px;
            background: white;
            color: #ff0066;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .card {
            background: rgba(255,255,255,0.18);
            padding: 28px 20px;
            border-radius: 22px;
            margin: 25px 0;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            line-height: 1.65;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .level { 
            font-size: 1.15rem; 
            margin: 12px 0; 
            font-weight: 600; 
            opacity: 0.95;
        }
        .footer {
            margin-top: 35px;
            font-size: 0.95rem;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Aleena Loves Abdul 🔥</h1>
        <h2>Truth or Dare</h2>

        <!-- Name Input Screen -->
        <div id="nameScreen">
            <p style="font-size:1.25rem; margin:20px 0 10px;">Enter Your Name</p>
            <input type="text" id="playerName" placeholder="Aleena or Abdul Rehman" autocomplete="off">
            <button onclick="startGame()">Start Game ❤️</button>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" style="display: none;">
            <div style="margin:25px 0 15px;">
                <button onclick="getTruth()" style="background:#ff3366;color:white;">Truth 😇</button>
                <button onclick="getDare()" style="background:#ff3366;color:white;">Dare 😈</button>
            </div>

            <div id="level" class="level"></div>
            <div id="question" class="card">Welcome! Ready to play a romantic & spicy game? 🔥</div>
            
            <button onclick="newOne()" style="background:#660033;color:white;">Next Question</button>
            
            <div class="footer">
                Made by Abdul Rehman ❤️
            </div>
        </div>
    </div>

    <script>
        let playerName = "";
        let isGirl = false;

        // === GIRL (Aleena style) ===
        const girlTruths = [
            "What do you find most attractive about Abdul?",
            "What is the most romantic thing Abdul has ever done for you?",
            "Describe your dream date with Abdul.",
            "What is one naughty thought you've had about Abdul recently?",
            "What turns you on the most about Abdul?",
            "Have you ever had a romantic dream about Abdul?",
            "What is your favorite way Abdul shows you love?",
            "If you could kiss Abdul anywhere right now, where would it be?",
            "What is something intimate you want to try with Abdul?",
            "How would you describe your feelings when Abdul touches you?"
        ];

        const girlDares = [
            "Send a cute selfie with a flying kiss to Abdul.",
            "Record a voice note saying something sweet and flirty to Abdul.",
            "Do a romantic dance for 10 seconds and send video.",
            "Write 'I ❤️ Abdul' on your hand and send photo.",
            "Send a photo of you in your favorite outfit.",
            "Call Abdul and say his name in the sweetest way.",
            "Send a romantic voice note describing your feelings.",
            // Mild Hot
            "Send a photo wearing his favorite color.",
            "Take off one accessory and send a teasing photo.",
            // Few 18+
            "Send a mirror selfie in nightwear.",
            "Record a short seductive voice note for Abdul."
        ];

        // === BOY (Abdul style) ===
        const boyTruths = [
            "What do you find most beautiful about Aleena?",
            "What is the most romantic thing you want to do for Aleena?",
            "Describe your ideal romantic evening with Aleena.",
            "What is one naughty thought you've had about Aleena recently?",
            "Which part of Aleena attracts you the most?",
            "Have you ever had a romantic or hot dream about Aleena?",
            "What makes you feel closest to Aleena?",
            "What is your favorite memory with Aleena?",
            "What intimate thing do you want to experience with Aleena?",
            "How does Aleena make you feel special?"
        ];

        const boyDares = [
            "Send a handsome selfie with a flying kiss.",
            "Record a romantic voice note for Aleena.",
            "Do a cute or romantic pose and send photo.",
            "Write 'I ❤️ Aleena' on your hand and send photo.",
            "Sing a romantic line from a song for Aleena.",
            "Send a photo of you looking your best.",
            "Say something sweet about Aleena in a voice note.",
            // Mild Hot
            "Send a shirtless photo (if comfortable).",
            "Do a slow romantic dance and send video.",
            // Few 18+
            "Send a mirror selfie in your favorite look.",
            "Record a short flirty voice note describing your desire."
        ];

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function startGame() {
            playerName = document.getElementById("playerName").value.trim();
            if (!playerName) playerName = "Baby";

            // Detect gender roughly
            const lowerName = playerName.toLowerCase();
            isGirl = lowerName.includes("aleena") || lowerName.includes("girl") || 
                     lowerName.includes("princess") || lowerName.includes("queen");

            document.getElementById("nameScreen").style.display = "none";
            document.getElementById("gameScreen").style.display = "block";
            
            document.getElementById("question").innerHTML = `Hi ${playerName}! Let's play a romantic & spicy Truth or Dare ❤️`;
        }

        function getTruth() {
            document.getElementById('level').innerHTML = "❤️ Truth (Romantic + Flirty)";
            let q = isGirl ? getRandom(girlTruths) : getRandom(boyTruths);
            document.getElementById('question').innerHTML = q + "<br><br><b>Screenshot & Send in Chat</b>";
        }

        function getDare() {
            document.getElementById('level').innerHTML = "😈 Dare (Romantic + Hot)";
            let d = isGirl ? getRandom(girlDares) : getRandom(boyDares);
            d = d.replace("Abdul", "Abdul").replace("Aleena", "Aleena");
            document.getElementById('question').innerHTML = d + "<br><br><b>Screenshot & Send in Chat</b>";
        }

        function newOne() {
            if (Math.random() > 0.5) {
                getTruth();
            } else {
                getDare();
            }
        }

        // Auto focus
        window.onload = () => {
            document.getElementById("playerName").focus();
        };
    </script>
</body>
</html>
