<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abdul Rehman & Aleena 💋</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');
        
        body {
            background: linear-gradient(135deg, #1a0033, #4a0033, #1a0033);
            font-family: 'Inter', sans-serif;
            color: #ffe6f0;
            min-height: 100vh;
            padding: 15px;
            margin: 0;
        }
        
        .container {
            max-width: 440px;
            margin: 0 auto;
            background: rgba(30, 0, 40, 0.95);
            border-radius: 28px;
            padding: 25px 20px;
            box-shadow: 0 20px 50px rgba(192, 38, 211, 0.4);
            border: 2px solid #c026d3;
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.1rem;
            text-align: center;
            margin-bottom: 5px;
            color: #ff99cc;
        }
        
        .subtitle {
            text-align: center;
            color: #ff66aa;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        
        .tabs {
            display: flex;
            background: rgba(0,0,0,0.4);
            border-radius: 50px;
            padding: 6px;
            margin: 20px 0;
        }
        
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .tab.active {
            background: #c026d3;
            color: white;
        }
        
        button {
            width: 100%;
            padding: 16px;
            margin: 10px 0;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1.1rem;
        }
        
        .truth-btn { background: linear-gradient(90deg, #9f4bff, #c026d3); }
        .dare-btn { background: linear-gradient(90deg, #e11d48, #f43f5e); }
        .letter-btn { background: linear-gradient(90deg, #ec4899, #f472b6); }
        
        .card {
            background: linear-gradient(135deg, #3b0764, #581c87);
            border: 3px solid #ff99cc;
            padding: 25px 20px;
            border-radius: 22px;
            margin: 20px 0;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.7;
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: '💋💕💋';
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.8rem;
            opacity: 0.3;
        }
        
        img {
            max-width: 100%;
            border-radius: 15px;
            margin: 10px 0;
            border: 2px solid #ff99cc;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            opacity: 0.85;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Abdul Rehman ❤️ Aleena</h1>
        <p class="subtitle">Our Romantic World 💋😘</p>

        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab(0)">Truth or Dare</div>
            <div class="tab" onclick="switchTab(1)">Love Letter</div>
            <div class="tab" onclick="switchTab(2)">Cute Challenges</div>
        </div>

        <!-- Truth or Dare -->
        <div id="tab0">
            <button onclick="getTruth()" class="truth-btn">Truth 😇💋</button>
            <button onclick="getDare()" class="dare-btn">Dare 😈😘</button>
            <div id="level" style="text-align:center; margin:15px 0; color:#ff99cc; font-weight:600;"></div>
            <div id="question" class="card">Choose Truth or Dare my love 💕</div>
            <button onclick="newOne()">Next Question 💕</button>
        </div>

        <!-- Love Letter -->
        <div id="tab1" style="display:none;">
            <textarea id="letterText" rows="5" placeholder="Write your sweet message for Aleena / Abdul... 💌"></textarea>
            <button onclick="generateLoveLetter()" class="letter-btn">Make Cute Love Card 💌</button>
            <div id="letterCard" class="card" style="display:none;">
                <!-- Dynamic content will appear here -->
            </div>
            <button onclick="shareWhatsApp()" style="background:#25D366;">Share on WhatsApp 📲</button>
        </div>

        <!-- Cute Challenges -->
        <div id="tab2" style="display:none;">
            <button onclick="getCuteChallenge()" style="background:linear-gradient(90deg, #db2777, #ec4899);">Get Cute Challenge 💕</button>
            <div id="cuteCard" class="card">Click to get adorable challenges for us 💋</div>
        </div>

        <div class="footer">
            Made with infinite love by Abdul Rehman ❤️<br>
            Only for Aleena 💋
        </div>
    </div>

    <script>
        let isAleena = false;

        // === Pictures (Upload these to same folder) ===
        // Use these exact names:
        // abdul-rehman.jpg
        // aleena.jpg

        const abdulPic = "abdul-rehman.jpg";
        const aleenaPic = "aleena.jpg";

        const girlTruths = [ /* your previous lists */ ];
        const girlDares = [ /* your previous lists with lots of kisses */ ];
        const boyTruths = [ /* your previous lists */ ];
        const boyDares = [ /* your previous lists */ ];

        const cuteChallenges = [
            "Send 10 💋 kisses in a voice note saying Abdul Rehman's name 😘",
            "Write 'Aleena ❤️ Abdul Rehman' on your hand and send photo",
            "Record a video saying 'I love you Abdul Rehman' with flying kisses 💕",
            "Send a mirror selfie with lots of heart emojis 💖",
            "Tell Aleena 5 reasons why you love her in a voice note",
            "Make a heart with your hands and say 'This is for Aleena' ❤️"
        ];

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function switchTab(n) {
            document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===n));
            document.getElementById('tab0').style.display = n===0 ? 'block' : 'none';
            document.getElementById('tab1').style.display = n===1 ? 'block' : 'none';
            document.getElementById('tab2').style.display = n===2 ? 'block' : 'none';
        }

        function startGame() {
            const name = prompt("Enter your name (Aleena or Abdul Rehman):");
            if (name) {
                isAleena = name.toLowerCase().includes("aleena");
            }
        }

        function getTruth() {
            document.getElementById('level').innerHTML = "❤️ TRUTH";
            let q = isAleena ? getRandom(girlTruths) : getRandom(boyTruths);
            document.getElementById('question').innerHTML = q + "<br><br><b>📸 Screenshot & Send 💕</b>";
        }

        function getDare() {
            document.getElementById('level').innerHTML = "😈 DARE";
            let d = isAleena ? getRandom(girlDares) : getRandom(boyDares);
            document.getElementById('question').innerHTML = d + "<br><br><b>📸 Screenshot or WhatsApp</b>";
        }

        function newOne() {
            Math.random() > 0.5 ? getTruth() : getDare();
        }

        function generateLoveLetter() {
            const text = document.getElementById("letterText").value.trim() || "I love you so much my baby 💕";
            const card = document.getElementById("letterCard");
            
            const pic = isAleena ? aleenaPic : abdulPic;
            
            card.innerHTML = `
                <img src="${pic}" alt="Our Love" style="width:100%; max-height:180px; object-fit:cover;">
                <strong style="color:#ff99cc;">💌 To My ${isAleena ? 'Abdul Rehman' : 'Aleena'} 💌</strong><br><br>
                ${text}<br><br>
                <em>Forever Yours ❤️<br>Abdul Rehman ${isAleena ? '❤️' : '💋'} Aleena</em>
            `;
            card.style.display = "block";
        }

        function shareWhatsApp() {
            const card = document.getElementById("letterCard");
            if (card.style.display === "block") {
                const message = card.innerText;
                window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
            } else {
                alert("First create a Love Card 💌");
            }
        }

        function getCuteChallenge() {
            document.getElementById('cuteCard').innerHTML = getRandom(cuteChallenges) + "<br><br><b>💋 Send to your love now</b>";
        }

        // Initialize
        window.onload = () => {
            startGame();
        };
    </script>
</body>
</html>
