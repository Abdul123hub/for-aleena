<!DOCTYPE html>

<style>
*{

</head>

<body>

<div class="floating" style="left:10%">💋</div>
<div class="floating" style="left:25%;animation-delay:2s">❤️</div>
<div class="floating" style="left:45%;animation-delay:4s">😘</div>
<div class="floating" style="left:65%;animation-delay:1s">💖</div>
<div class="floating" style="left:85%;animation-delay:6s">💕</div>

<div class="container">

<div id="login" class="glass">

<h1>💋 Aleena ❤️ Abdul 💋</h1>
<p class="subtitle">Special Couple Edition</p>

<input id="name" placeholder="Enter Your Name">

<select id="role">
<option value="boy">👦 Boy</option>
<option value="girl">👧 Girl</option>
</select>

<button onclick="startGame()">Unlock ❤️</button>

</div>

<div id="game" class="glass" style="display:none">

<h2 id="welcome"></h2>

<div class="score">
Love Score ❤️ : <span id="score">0</span>
</div>

<button class="truthBtn" onclick="truth()">😇 Truth</button>
<button class="dareBtn" onclick="dare()">😈 Dare</button>
<button class="partnerBtn" onclick="partner()">🤝 Partner</button>

<div id="question" class="card">
Choose a category ❤️
</div>

<button class="nextBtn" onclick="randomChallenge()">🎲 Random</button>

</div>

</div>

<script>

let role="boy";
let score=0;

const boyTruths=[
"What is your favorite thing about Aleena?",
"When did you first realize you liked Aleena?",
"What is your dream date with Aleena?",
"What memory with Aleena makes you smile instantly?",
"What is the cutest thing Aleena does?",
"What is one thing you admire most about Aleena?",
"What nickname would you give Aleena?",
"Which picture of Aleena is your favorite?",
"What song reminds you of Aleena?",
"What is one thing you want to do together in the future?"
];

const girlTruths=[
"What was your first impression of Abdul?",
"What is Abdul's most attractive quality?",
"When did you realize you liked Abdul?",
"What is your favorite memory with Abdul?",
"What is the sweetest thing Abdul has done?",
"Which photo of Abdul is your favorite?",
"What song reminds you of Abdul?",
"What makes Abdul special to you?",
"What is your dream date with Abdul?",
"What is one thing you never told Abdul?"
];

const boyDares=[
"Send Aleena 15 heart emojis ❤️",
"Tell Aleena 3 things you admire about her.",
"Send your favorite photo of Aleena.",
"Record a 10-second voice note for Aleena.",
"Give Aleena a cute nickname.",
"Send a selfie right now 📸",
"Tell Aleena your favorite memory together.",
"Send a romantic song.",
"Text Aleena something sweet.",
"Describe Aleena using only 3 emojis."
];

const girlDares=[
"Send Abdul a selfie with a flying kiss 💋",
"Send Abdul 15 kiss emojis 😘",
"Give Abdul a romantic nickname.",
"Tell Abdul something sweet.",
"Record a voice note saying his name.",
"Send Abdul your favorite picture of him.",
"Share your favorite memory together.",
"Send a romantic song.",
"Describe Abdul using only emojis.",
"Tell Abdul one thing you appreciate about him."
];

const spicyTruths=[
"Have you ever blushed reading your partner's message?",
"What compliment from your partner do you remember most?",
"What is your favorite thing your partner wears?",
"Have you ever waited eagerly for their text?",
"What is one thing your partner does that makes your heart race?"
];

const spicyDares=[
"Send a flirty selfie 😉",
"Send a message saying what you miss most about them.",
"Tell your partner one thing you find attractive about them.",
"Send a voice note with a sweet compliment.",
"Send a 💋 emoji and a mystery message."
];

const partnerDares=[
"Ask your partner their favorite memory with you.",
"Ask your partner to rate your smile from 1-10.",
"Ask your partner for a cute selfie.",
"Ask your partner what they admire most about you.",
"Ask your partner what song reminds them of you.",
"Ask your partner for a voice note.",
"Ask your partner for a nickname.",
"Ask your partner their dream date.",
"Ask your partner their favorite photo of you.",
"Ask your partner what first attracted them to you."
];

function pick(arr){
return arr[Math.floor(Math.random()*arr.length)];
}

function addScore(){
score++;
document.getElementById("score").innerText=score;

if(score===10){
document.getElementById("question").innerHTML=
"🎁 Surprise Unlocked! ❤️<br><br>Screenshot this and send: 'You make my days brighter 💕'";
}
}

function startGame(){

let name=document.getElementById("name").value.trim().toLowerCase();

let allowed=[
"aleena",
"abdul",
"abdul rehman",
"abdulrehman"
];

if(!allowed.includes(name)){
alert("❌ Access Denied ❤️");
return;
}

role=document.getElementById("role").value;

document.getElementById("login").style.display="none";
document.getElementById("game").style.display="block";

document.getElementById("welcome").innerHTML=
"Welcome ❤️";
}

function truth(){

let pool = role==="boy" ? boyTruths : girlTruths;

if(Math.random()<0.25){
document.getElementById("question").innerHTML=pick(spicyTruths);
}else{
document.getElementById("question").innerHTML=pick(pool);
}

addScore();
}

function dare(){

let pool = role==="boy" ? boyDares : girlDares;

if(Math.random()<0.25){
document.getElementById("question").innerHTML=pick(spicyDares);
}else{
document.getElementById("question").innerHTML=pick(pool);
}

addScore();
}

function partner(){
document.getElementById("question").innerHTML=pick(partnerDares);
addScore();
}

function randomChallenge(){

let num=Math.floor(Math.random()*3);

if(num===0) truth();
if(num===1) dare();
if(num===2) partner();

}

</script>

</body>
</html>
