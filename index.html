```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aleena ❤️ Abdul</title>

<style>
body{
    margin:0;
    font-family:Poppins,sans-serif;
    background:linear-gradient(135deg,#ff4d88,#ff80aa,#ff3366);
    color:white;
    text-align:center;
    min-height:100vh;
    overflow:hidden;
}

.container{
    max-width:400px;
    margin:auto;
    padding:20px;
}

.card{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:20px;
    margin-top:20px;
    min-height:140px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.1rem;
}

input,select{
    width:85%;
    padding:12px;
    border:none;
    border-radius:30px;
    margin:10px;
    text-align:center;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:30px;
    margin:8px;
    cursor:pointer;
    font-weight:bold;
}

.floating{
    position:fixed;
    font-size:24px;
    animation:float 8s linear infinite;
    opacity:.7;
}

@keyframes float{
    from{transform:translateY(100vh);}
    to{transform:translateY(-100px);}
}
</style>
</head>

<body>

<div class="floating" style="left:10%">💋</div>
<div class="floating" style="left:30%;animation-delay:2s;">❤️</div>
<div class="floating" style="left:55%;animation-delay:4s;">😘</div>
<div class="floating" style="left:80%;animation-delay:1s;">💖</div>

<div class="container">

<h1>💋 Aleena ❤️ Abdul 💋</h1>

<div id="login">
    <input type="text" id="name" placeholder="Enter Name">
    <br>

    <select id="gender">
        <option value="boy">👦 Boy</option>
        <option value="girl">👧 Girl</option>
    </select>
    <br>

    <button onclick="startGame()">Start ❤️</button>
</div>

<div id="game" style="display:none;">

    <h3 id="welcome"></h3>

    <button onclick="truth()">😇 Truth</button>
    <button onclick="dare()">😈 Dare</button>
    <button onclick="partner()">🤝 Partner</button>

    <div class="card" id="question">
        Ready to Play? ❤️
    </div>

</div>

</div>

<script>

let role="boy";

const boyTruths=[
"What is your favorite thing about Aleena?",
"When did you first realize you liked Aleena?",
"Which photo of Aleena is your favorite?",
"What is your dream date with Aleena?",
"What is the cutest thing Aleena does?"
];

const girlTruths=[
"What is your favorite thing about Abdul?",
"What was your first impression of Abdul?",
"What is Abdul's most attractive feature?",
"What is your favorite memory with Abdul?",
"Have you ever re-read Abdul's messages?"
];

const boyDares=[
"Send Aleena 10 heart emojis ❤️",
"Record a voice note saying her name.",
"Tell Aleena 3 things you like about her.",
"Send your favorite photo of Aleena.",
"Give Aleena a cute nickname."
];

const girlDares=[
"Send Abdul a flying kiss selfie 💋",
"Tell Abdul something sweet.",
"Send Abdul 10 kiss emojis 😘",
"Give Abdul a romantic nickname.",
"Send a voice note saying 'I miss you'."
];

const partnerDares=[
"Ask your partner their favorite memory with you ❤️",
"Ask your partner to rate your smile 😘",
"Ask your partner for a cute selfie 📸",
"Ask your partner what they admire most about you.",
"Ask your partner what song reminds them of you 🎶"
];

function random(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}

function startGame(){

    let name=document.getElementById("name").value.trim().toLowerCase();

    const allowed=[
        "aleena",
        "abdul",
        "abdul rehman",
        "abdulrehman"
    ];

    if(!allowed.includes(name)){
        alert("❌ Access Denied 💋 Only Aleena & Abdul can enter ❤️");
        return;
    }

    role=document.getElementById("gender").value;

    document.getElementById("login").style.display="none";
    document.getElementById("game").style.display="block";

    document.getElementById("welcome").innerHTML=
    "Welcome ❤️";
}

function truth(){

    if(role==="boy"){
        document.getElementById("question").innerHTML=random(boyTruths);
    }else{
        document.getElementById("question").innerHTML=random(girlTruths);
    }
}

function dare(){

    if(role==="boy"){
        document.getElementById("question").innerHTML=random(boyDares);
    }else{
        document.getElementById("question").innerHTML=random(girlDares);
    }
}

function partner(){
    document.getElementById("question").innerHTML=random(partnerDares);
}

</script>

</body>
</html>
```
