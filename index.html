<!DOCTYPE html>
<html lang="en">
<head>

    <style>

        body {
            background: linear-gradient(135deg, #ff0066, #ff6699, #cc0066);
            font-family: 'Poppins', sans-serif;
            color: white;
            text-align: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 { font-family: 'Playfair Display', serif; font-size: 2.8rem; margin: 20px 0; }
        .container { max-width: 420px; margin: 0 auto; }
        button {
            padding: 18px 40px;
            font-size: 1.3rem;
            margin: 15px 8px;
            border: none;
            border-radius: 50px;
            background: white;
            color: #ff0066;
            font-weight: bold;
            cursor: pointer;
        }
        .card {
            background: rgba(255,255,255,0.15);
            padding: 25px;
            border-radius: 20px;
            margin: 25px 0;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            line-height: 1.6;
        }
        .level { font-size: 1.1rem; margin: 10px 0; font-weight: 600; }
        input {
            padding: 15px;
            font-size: 1.2rem;
            width: 80%;
            border-radius: 50px;
            border: none;
            margin: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Aleena Loves Abdul 🔥</h1>
        <h2>Truth or Dare Game</h2>

        <!-- Name Input -->
        <div id="nameScreen">
            <p style="font-size:1.3rem; margin:20px 0;">Enter Your Name</p>
            <input type="text" id="playerName" placeholder="e.g. Aleena or Abdul Rehman" autocomplete="off">
            <button onclick="startGame()">Start Game 🔥</button>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" style="display: none;">
            <div style="margin:30px 0 20px;">
                <button onclick="getTruth()" style="background:#ff3366;color:white;">Truth 😇</button>
                <button onclick="getDare()" style="background:#ff3366;color:white;">Dare 😈</button>
            </div>

            <div id="level" class="level"></div>
            <div id="question" class="card">Ready to play hot game? 🔥</div>
            <button onclick="newOne()" style="background:#660033;color:white;">Next Question</button>
            
            <p style="margin-top:30px; font-size:1rem; opacity:0.9;">
                Made by Abdul Rehman ❤️
            </p>
        </div>
    </div>

    <script>
        let playerName = "";

        // Mixed Truths (Romantic + Naughty)
        const truths = [
            "What is your favorite thing about your partner?",
            "What is the naughtiest thought you've had about your partner today?",
            "Have you ever touched yourself thinking about your partner?",
            "Which part of your partner's body turns you on the most?",
            "Describe your wildest fantasy with your partner.",
            "What is one romantic thing you want to do with your partner?",
            "Have you ever had a wet dream about your partner?",
            "What is the most risky place you want to make love with your partner?",
            "What color underwear are you wearing right now? (Send proof)",
            "Send a voice note telling your partner what you feel for them.",
            "What is your favorite sex position with your partner?",
            "Rate your partner's body from 1-10 and explain why.",
            "Have you ever stolen your partner's underwear?",
            "What is the hottest thing your partner has ever done?"
        ];

        // Mixed Dares (Shareef + Hot 18+)
        const mildDares = [
            "Say 'I love you' in the most romantic way and send voice note.",
            "Dance for 10 seconds and send video.",
            "Send a cute selfie with a flying kiss.",
            "Sing one line of a romantic song for your partner.",
            "Do a funny face and send photo.",
            "Say your partner's name 10 times seductively.",
            "Write your partner's name on your hand and show.",
            "Send a voice note describing your first meeting."
        ];

        const hotDares = [
            "Send a shirtless / bra-less photo right now.",
            "Take off one piece of clothing and send proof.",
            "Send a photo of yourself in underwear.",
            "Do a sexy dance on video (minimum 10 seconds).",
            "Send a voice note moaning your partner's name.",
            "Write 'I belong to [Partner]' on your body and send photo.",
            "Send a completely naked photo (one view only).",
            "Record a short video touching yourself while saying your partner's name.",
            "Send a photo of your hard dick / wet pussy.",
            "Do a striptease video (minimum 15 seconds).",
            "Record a 10-second masturbation video and send.",
            "Send a voice note describing how you want to fuck your partner."
        ];

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function startGame() {
            playerName = document.getElementById("playerName").value.trim();
            if (playerName === "") playerName = "Baby";

            document.getElementById("nameScreen").style.display = "none";
            document.getElementById("gameScreen").style.display = "block";
            
            document.getElementById("question").innerHTML = `Hi ${playerName}! Let's play mixed hot Truth or Dare 🔥`;
        }

        function getTruth() {
            document.getElementById('level').innerHTML = "❤️ Truth (Mixed)";
            let q = getRandom(truths);
            document.getElementById('question').innerHTML = q + "<br><br><b>Screenshot & Send in Chat</b>";
        }

        function getDare() {
            const rand = Math.random();
            let dareText;
            
            if (rand < 0.45) {
                document.getElementById('level').innerHTML = "😊 Mild Dare";
                dareText = getRandom(mildDares);
            } else {
                document.getElementById('level').innerHTML = "🔥 Hot Dare (18+)";
                dareText = getRandom(hotDares);
            }
            
            dareText = dareText.replace("[Partner]", playerName);
            document.getElementById('question').innerHTML = dareText + "<br><br><b>Screenshot & Send in Chat</b>";
        }

        function newOne() {
            if (Math.random() > 0.5) {
                getTruth();
            } else {
                getDare();
            }
        }

        window.onload = () => {
            document.getElementById("playerName").focus();
        };
    </script>
</body>
</html>
