<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleena Loves Abdul - Truth or Dare 💋</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap');
       
        body {
            background: linear-gradient(135deg, #ff0066, #ff3366, #cc0066);
            font-family: 'Poppins', sans-serif;
            color: white;
            text-align: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { 
            max-width: 440px; 
            margin: 0 auto; 
            background: rgba(0,0,0,0.15);
            border-radius: 28px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { 
            font-family: 'Playfair Display', serif; 
            font-size: 2.5rem; 
            margin: 15px 0 8px; 
            text-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }
        h2 { 
            font-size: 1.4rem; 
            margin: 0 0 25px; 
            opacity: 0.95;
        }
        input {
            padding: 16px 20px;
            font-size: 1.15rem;
            width: 85%;
            border-radius: 50px;
            border: none;
            margin: 15px 0 20px;
            text-align: center;
            background: white;
            color: #333;
        }
        button {
            padding: 16px 35px;
            font-size: 1.2rem;
            margin: 10px 6px;
            border: none;
            border-radius: 50px;
            background: white;
            color: #ff0066;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .card {
            background: rgba(255,255,255,0.18);
            padding: 28px 20px;
            border-radius: 22px;
            margin: 25px 0;
            min-height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            line-height: 1.65;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .level { 
            font-size: 1.15rem; 
            margin: 12px 0; 
            font-weight: 600; 
            opacity: 0.95;
        }
        .footer {
            margin-top: 35px;
            font-size: 0.95rem;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Aleena Loves Abdul 💋🔥</h1>
        <h2>Truth or Dare 😘</h2>

        <!-- Name Input -->
        <div id="nameScreen">
            <p style="font-size:1.25rem; margin:20px 0 10px;">Enter Your Name 💕</p>
            <input type="text" id="playerName" placeholder="Aleena or Abdul Rehman" autocomplete="off">
            <button onclick="startGame()">Start Game ❤️💋</button>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" style="display: none;">
            <div style="margin:25px 0 15px;">
                <button onclick="getTruth()" style="background:#ff3366;color:white;">Truth 😇💋</button>
                <button onclick="getDare()" style="background:#ff3366;color:white;">Dare 😈😘</button>
            </div>

            <div id="level" class="level"></div>
            <div id="question" class="card">Hi there! Ready for Romantic, Flirty & Spicy fun? 💋🔥</div>
            
            <button onclick="newOne()" style="background:#660033;color:white;">Next Question 💕</button>
            
            <div class="footer">
                Made by Abdul Rehman ❤️💋
            </div>
        </div>
    </div>

    <script>
        let playerName = "";
        let isGirl = false;

        // === GIRL TRUTHS ===
        const girlTruths = [
            "What do you find most attractive about Abdul? 💋",
            "What is the most romantic thing Abdul has ever done for you? 😘",
            "Describe your dream date with Abdul 💕",
            "What is one naughty/flirty thought you've had about Abdul recently? 🔥",
            "Which part of Abdul's body turns you on the most? 💋",
            "Have you ever had a hot dream about Abdul? 😈",
            "What intimate thing do you want Abdul to do to you? 👄",
            "What is your darkest fantasy involving Abdul? 😘",
            "How would you describe the feeling when Abdul kisses you? 💋",
            "What turns you on the most when thinking about Abdul? 🔥"
        ];

        // === GIRL DARES ===
        const girlDares = [
            "Send a cute selfie with a flying kiss to Abdul 😘",
            "Record a romantic & flirty voice note for Abdul 💕",
            "Do a slow romantic dance for 10 seconds and send video 💃",
            "Write 'I ❤️ Abdul' on your hand and send photo 💋",
            "Send a photo in your favorite outfit looking beautiful 😘",
            "Say something sweet and flirty about Abdul in a voice note 💕",
            "Send a mirror selfie blowing a kiss 😘",
            "Send a photo in nightwear or lingerie (one view) 💋",
            "Record a voice note moaning Abdul's name softly 👄",
            "Tell your darkest fantasy with Abdul in a voice note 😈",
            "Do a seductive pose and send photo 🔥"
        ];

        // === BOY TRUTHS ===
        const boyTruths = [
            "What do you find most beautiful about Aleena? 💋",
            "What is the most romantic thing you want to do for Aleena? 😘",
            "Describe your ideal hot date with Aleena 💕",
            "What is one naughty thought you've had about Aleena recently? 🔥",
            "Which part of Aleena's body attracts you the most? 💋",
            "Have you ever had a romantic or hot dream about Aleena? 😈",
            "What intimate thing do you want to do with Aleena? 👄",
            "What is your darkest fantasy with Aleena? 😘",
            "How does Aleena make your heart race? 💓",
            "What turns you on the most about Aleena? 🔥"
        ];

        // === BOY DARES ===
        const boyDares = [
            "Send a handsome selfie with a flying kiss 😘",
            "Record a romantic & flirty voice note for Aleena 💕",
            "Do a romantic pose and send photo 💋",
            "Write 'I ❤️ Aleena' on your hand and send photo 😘",
            "Sing a romantic line for Aleena and send video 🎤",
            "Send a photo looking your best 💪",
            "Say something hot and sweet about Aleena in a voice note 🔥",
            "Send a shirtless photo (one view only) 💋",
            "Record a voice note moaning Aleena's name seductively 👄",
            "Do a slow sexy dance and send short video 😈",
            "Tell your darkest fantasy with Aleena in a voice note 😘",
            "Send a mirror selfie in underwear (if comfortable) 🔥"
        ];

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function startGame() {
            playerName = document.getElementById("playerName").value.trim();
            if (!playerName) playerName = "Baby";

            const lower = playerName.toLowerCase();
            isGirl = lower.includes("aleena") || lower.includes("girl") || 
                     lower.includes("princess") || lower.includes("queen");

            document.getElementById("nameScreen").style.display = "none";
            document.getElementById("gameScreen").style.display = "block";
            
            document.getElementById("question").innerHTML = `Hi ${playerName}! Ready for Romantic, Flirty & Spicy Truth or Dare? 💋🔥`;
        }

        function getTruth() {
            document.getElementById('level').innerHTML = "❤️ Truth (Romantic + Flirty) 💋";
            let q = isGirl ? getRandom(girlTruths) : getRandom(boyTruths);
            document.getElementById('question').innerHTML = q + "<br><br><b>Screenshot & Send in Chat 💕</b>";
        }

        function getDare() {
            document.getElementById('level').innerHTML = "😈 Dare (Flirty + Hot) 😘";
            let d = isGirl ? getRandom(girlDares) : getRandom(boyDares);
            document.getElementById('question').innerHTML = d + "<br><br><b>Screenshot & Send in Chat 💋</b>";
        }

        function newOne() {
            if (Math.random() > 0.5) {
                getTruth();
            } else {
                getDare();
            }
        }

        window.onload = () => {
            document.getElementById("playerName").focus();
        };
    </script>
</body>
</html>
